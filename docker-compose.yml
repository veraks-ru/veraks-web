# Локальный кластер «Оракул».
#
# ВЕСЬ стек в Docker (как поедет в k8s) — где доступны Docker Hub и PyPI:
#   docker compose --profile full up --build
#   (postgres + redis + backend + worker + mock-esia + frontend)
#
# Только слой данных (когда реестр образов / PyPI недоступны, напр. в песочнице):
#   docker compose up -d            # postgres + redis + mailpit
#   далее backend/worker/mock-esia/frontend — на хосте (см. README.dev.md).
#
# Бэкенд:   http://localhost:8000   Мок ЕСИА: http://localhost:9000
# Postgres: localhost:5432          Redis:    localhost:6379
# Mailpit (веб-интерфейс писем): http://localhost:8025   SMTP: localhost:1025

x-backend-env: &backend-env
  APP_ENV: local
  APP_DEBUG: "true"
  DATABASE_URL: postgresql+asyncpg://orakul:orakul@postgres:5432/orakul
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOW_ORIGINS: http://localhost:3000
  SECURITY_SNILS_HMAC_KEY: a69582e01b4583bfd027394f16e51aa97e5b56bdcd0f0352
  SECURITY_FIELD_ENCRYPTION_KEY: IQT3A8X7KXgszNLMsJFZ_IWN676fvuO2Wm8_4KmfFew=
  SECURITY_JWT_SECRET: 4d44d203176197815b60e60799ccbc507840e58e6e253af1
  SECURITY_COOKIE_SECURE: "false"
  ESIA_CLIENT_ID: orakul-dev
  ESIA_REDIRECT_URI: http://localhost:3000/auth/esia/callback
  ESIA_AUTHORIZATION_ENDPOINT: http://localhost:9000/authorize
  ESIA_TOKEN_ENDPOINT: http://mock-esia:9000/token
  ESIA_USERINFO_ENDPOINT: http://mock-esia:9000/userinfo
  ESIA_REQUIRE_CONFIRMED: "true"
  # Проверка id_token по JWKS мока. ISSUER — строка внутри маркера (одна на всех,
  # совпадает с MOCK_ESIA_ISSUER), JWKS_URL — server-to-server адрес сервиса.
  ESIA_ISSUER: http://localhost:9000
  ESIA_JWKS_URL: http://mock-esia:9000/jwks
  # Локально окно оспаривания = 0ч: «Разрешить → Посчитать» в админке срабатывает
  # сразу (в проде окно реальное, по умолчанию 72ч).
  RESOLUTIONS_DISPUTE_WINDOW_HOURS: "0"
  # Реал-тайм уведомления через goctopus (WS-релей).
  GOCTOPUS_URL: http://goctopus:7890
  GOCTOPUS_USER: orakul
  GOCTOPUS_PASSWORD: goctopus-dev-secret
  # Провайдеры входа: сейчас только email — ЕСИА выключена флагом (нет
  # договора с интегратором), код и мок остаются, включаются обратно
  # добавлением "esia" в список через запятую.
  AUTH_PROVIDERS: email
  # Почта (magic-link вход): локально письма улетают в mailpit — реальной
  # отправки нет, читать на http://localhost:8025. Без логина/пароля/TLS.
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: noreply@orakul.local
  MAIL_FROM_NAME: Оракул
  MAIL_USE_TLS: "false"
  MAIL_USE_STARTTLS: "false"
  MAIL_LINK_BASE_URL: http://localhost:3000

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: orakul
      POSTGRES_PASSWORD: orakul
      POSTGRES_DB: orakul
      # T9: непривилегированная роль приложения orakul_app создаётся init-
      # скриптом ниже «из коробки» (только при первой инициализации пустого
      # тома). DATABASE_URL приложения по-прежнему владелец — локально
      # удобство важнее второго контура защиты (см. backend/README.md).
      APP_DB_ROLE: orakul_app
      APP_DB_PASSWORD: orakul_app_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Каноничный bootstrap-скрипт роли — источник истины backend/scripts
      # (тот же файл использует Helm-чарт); init-скрипт ниже его вызывает.
      - ../backend/scripts/create_app_role.sql:/opt/orakul/create_app_role.sql:ro
      - ./dev/postgres-initdb/010-create-app-role.sh:/docker-entrypoint-initdb.d/010-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orakul -d orakul"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Приём почты для локальной разработки: письма с magic-link входа улетают
  # сюда вместо реальной отправки. SMTP без логина/пароля/TLS — веб-интерфейс
  # для чтения писем на http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ── Слой приложения в Docker (профиль full; нужен доступ к Docker Hub) ──
  mock-esia:
    profiles: ["full"]
    build: ./dev/mock-esia
    environment:
      # ``iss`` подписанного id_token — должен совпадать с ESIA_ISSUER бэкенда.
      MOCK_ESIA_ISSUER: http://localhost:9000
    ports:
      - "9000:9000"

  backend:
    profiles: ["full"]
    build: ../backend
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  goctopus:
    profiles: ["full"]
    image: avvolob/goctopus:latest
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: "7890"
      WS_LOGIN: orakul
      WS_PASSWORD: goctopus-dev-secret
      WS_AUTH_URL: http://backend:8000/realtime/ws-auth
      WS_STORAGE: memory
      WS_ALLOWED_ORIGINS: http://localhost:3000
      WS_VERBOSE: "1"
    ports:
      - "7890:7890"
    depends_on:
      backend:
        condition: service_started

  worker:
    profiles: ["full"]
    build: ../backend
    environment: *backend-env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: arq app.worker.WorkerSettings

  frontend:
    profiles: ["full"]
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_GOCTOPUS_URL: ws://localhost:7890/ws
    # Рантайм (не вшивается в бандл): база для абсолютных ссылок на OG-картинки.
    environment:
      SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
